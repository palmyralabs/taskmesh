version=0.1.0-SNAPSHOT
group=com.palmyralabs.taskmesh

# taskmesh-simple/-pro/-max/-testkit have no dependency on each other (only on
# taskmesh-api), so their :test tasks can run concurrently instead of one
# module at a time — the biggest single lever here, since each module pays its
# own JVM + Spring context startup cost.
org.gradle.parallel=true
org.gradle.caching=true
