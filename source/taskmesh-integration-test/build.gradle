// End-to-end harness: boots the whole taskmesh engine (via the Spring Boot
// starter auto-config) against an in-memory H2 database and drives it through
// real enqueue -> claim -> process -> release/incident/rerun flows. Test-only —
// no published artifact.
configurations.testRuntimeClasspath {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

dependencies {
    testImplementation project(':taskmesh-spring-boot-starter')
    testImplementation project(':taskmesh-simple')
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.4'
    testRuntimeOnly 'com.h2database:h2:2.2.224'
}

// The large-scale soak test runs ~600 worker threads and 50k tasks in in-memory H2.
tasks.withType(Test).configureEach {
    maxHeapSize = '2g'
    jvmArgs '-Xss512k'
}

// The long-running load/soak/chaos suites here (LongRunningLoadTest, LargeScaleMultiNodeTest,
// MultiNodeChaosTest) are tagged @Tag("stress") and excluded from `test` by the root build,
// along with the tiers' throughput and large-scale torture suites. One tag, one exclusion,
// one task, for every module:
//
//     ./gradlew :taskmesh-integration-test:stressTest
//
// The exclusion used to live here, so it covered only this module — and because two of the
// three classes named above were never actually annotated, it did not exclude them at all.
// They ran on every build: 74s of the ~122s this module spent.
