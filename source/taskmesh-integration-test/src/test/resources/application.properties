# In-memory H2 for the end-to-end harness.
spring.datasource.url=jdbc:h2:mem:taskmesh;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema from the entities (validates the mappings end-to-end).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Single-node HIGH_VOLUME profile (MultiNodeTaskLedger), fast poll for the test.
taskmesh.profile=HIGH_VOLUME
taskmesh.query-interval-seconds=1
taskmesh.worker-pool-size=2
taskmesh.max-retries=3
