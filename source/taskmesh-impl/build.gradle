// spring-boot-starter-test brings its own Logback binding — the root
// build.gradle's slf4j-simple (added for the other modules' plain JUnit
// tests) conflicts with Spring Boot's LoggingApplicationListener, which
// assumes Logback is the actual bound provider. Exclude it here only.
configurations.testRuntimeClasspath {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

dependencies {
    api project(':taskmesh-engine')
    api 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.4'
    testRuntimeOnly 'com.h2database:h2:2.2.224'
}
